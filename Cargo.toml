[package]
name = "miniterm"
version = "0.1.0"
edition = "2021"

[dependencies]
winit = "0.29"
wgpu = "0.19"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
slotmap = "1"
alacritty_terminal = "0.24"
portable-pty = "0.8"
swash = "0.1"
raw-window-handle = "0.6"
winreg = "0.52"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
